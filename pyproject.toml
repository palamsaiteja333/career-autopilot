[project]
name = "career-autopilot"
version = "0.1.0"
description = "Local-first career automation platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
career-autopilot = "career_autopilot.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.13,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_autopilot"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
